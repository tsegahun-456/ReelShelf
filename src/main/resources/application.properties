spring.application.name=movie-watchlist-web
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/movie_watchlist}
spring.datasource.username=${DATABASE_USERNAME:moviewatchlist}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p

firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

library.roots=${MEDIA_ROOTS:}
library.scan-interval-ms=${MEDIA_SCAN_INTERVAL_MS:60000}
library.scan-initial-delay-ms=3000
library.ffprobe-command=${FFPROBE_COMMAND:ffprobe}
library.ffmpeg-command=${FFMPEG_COMMAND:ffmpeg}

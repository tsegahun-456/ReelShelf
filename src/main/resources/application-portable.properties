# Standalone desktop bundle: all account, watchlist, and local library data stays on this PC.
server.address=127.0.0.1
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:${MOVIE_WATCHLIST_DB:${user.home}/.local/share/movie-watchlist/database/movie-watchlist};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/portable-schema.sql
spring.jpa.defer-datasource-initialization=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

tmdb.api-key=${TMDB_API_KEY:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p

firebase.web-api-key=${FIREBASE_WEB_API_KEY:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

library.roots=${MEDIA_ROOTS:}
library.public-preview=true
library.scan-interval-ms=${MEDIA_SCAN_INTERVAL_MS:60000}
library.scan-initial-delay-ms=3000
library.ffprobe-command=${FFPROBE_COMMAND:ffprobe}
library.ffmpeg-command=${FFMPEG_COMMAND:ffmpeg}
